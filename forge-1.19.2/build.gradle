plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

group = 'com.logisticscraft.lc2'
version = project.property('mod_version')
base.archivesName = "trera-forge-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    flatDir {
        dirs '../.mhera-deps'
    }
}

sourceSets {
    main {
        java.srcDir file('../src/common/src/main/java')
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory layout.buildDirectory.dir("run/$name").get().asFile
            property 'forge.logging.console.level', 'info'
            mods {
                trera {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("com.industrialage.ia2:mhera-forge-1.19.2:${mhera_version}")
    compileOnly(fg.deobf("maven.modrinth:the-one-probe:KCnKC3d7")) { transitive = false }
    compileOnly(fg.deobf("maven.modrinth:curios:uUAY30IE")) { transitive = false }
    compileOnly(fg.deobf("maven.modrinth:jade:kp0HjPre")) { transitive = false }
    compileOnly(fg.deobf("maven.modrinth:wthit:FuMynGus")) { transitive = false }
    compileOnly(fg.deobf("maven.modrinth:jei:yr59GtS6")) { transitive = false }
    compileOnly(fg.deobf("maven.modrinth:emi:lvh62wOB")) { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def generatedTreraResources = layout.buildDirectory.dir('generated/trera-resources')
def generateTreraResources = tasks.register('generateTreraResources', Exec) {
    def generator = file('../src/datagen/generate_resources.py')
    onlyIf { generator.isFile() }
    inputs.files(fileTree('../src/datagen') { include '*.py', '*.json', '*.tsv' })
    inputs.files(fileTree('../assets/trera/lang') { include '*.json' })
    outputs.dir(generatedTreraResources)
    commandLine 'python3', generator, '--target', 'forge-1.19.2',
            '--output', generatedTreraResources.get().asFile
}

tasks.named('processResources') {
    dependsOn generateTreraResources
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    doFirst { delete destinationDir }
    inputs.properties(
            version: project.version,
            minecraftVersion: minecraft_version,
            forgeVersion: forge_version,
            mheraVersion: mhera_version
    )
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraftVersion: minecraft_version,
                forgeVersion: forge_version,
                mheraVersion: mhera_version
    }
    from(file('../assets')) {
        into 'assets'
        exclude '**/*.md', '**/*.csv', '**/.git*', '**/.DS_Store', 'preview/**', 'brand/**'
    }
    from(generatedTreraResources) { exclude '.trera-generated-output' }
}

tasks.named('jar') {
    manifest {
        attributes 'MixinConfigs': 'trera.mixins.json'
    }
    from file('../LICENSE')
    finalizedBy 'reobfJar'
}

apply from: 'qa.gradle'
