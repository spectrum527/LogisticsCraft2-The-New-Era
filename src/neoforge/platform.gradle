java.toolchain.languageVersion = JavaLanguageVersion.of(platformJava)
base.archivesName = "trera-neoforge-$minecraftVersion"
sourceSets.main.java.srcDir('../shared/src/main/java')

def mheraVersion = rootProject.property('mhera_version')
def mheraJar = rootProject.file(".mhera-deps/mhera-neoforge-${minecraftVersion}-${mheraVersion}.jar")
if (!mheraJar.isFile()) {
    throw new GradleException("Missing MHERA dependency JAR: ${mheraJar}")
}

dependencies {
    implementation project(':common')
    compileOnly files(mheraJar)
}

neoForge {
    enable {
        version = neoForgeVersion
        disableRecompilation = true
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        trera {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

def generatedTreraResources = layout.buildDirectory.dir('generated/trera-resources')
def generateTreraResources = tasks.register('generateTreraResources', Exec) {
    def generator = rootProject.file('src/datagen/generate_resources.py')
    onlyIf { generator.isFile() }
    inputs.files(rootProject.fileTree('src/datagen') { include '*.py', '*.json', '*.tsv' })
    inputs.files(rootProject.fileTree('assets/trera/lang') { include '*.json' })
    inputs.property('minecraftTarget', minecraftVersion)
    outputs.dir(generatedTreraResources)
    commandLine 'python3', generator, '--target', "neoforge-${minecraftVersion}",
            '--output', generatedTreraResources.get().asFile
}

tasks.named('processResources') {
    dependsOn generateTreraResources
    filteringCharset = 'UTF-8'
    inputs.properties(
            version: project.version,
            neoForgeVersion: neoForgeVersion,
            minecraftVersion: minecraftVersion,
            mheraVersion: mheraVersion,
            loaderMetadata: loaderMetadata
    )
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    doFirst { delete destinationDir }
    from(rootProject.file('assets')) {
        into 'assets'
        exclude '**/*.md', '**/*.csv', '**/.git*', '**/.DS_Store', 'preview/**', 'brand/**'
    }
    from(generatedTreraResources) { exclude '.trera-generated-output' }
    from('../metadata') {
        expand version: project.version,
                neoForgeVersion: neoForgeVersion,
                minecraftVersion: minecraftVersion,
                mheraVersion: mheraVersion,
                loaderMetadata: loaderMetadata
    }
}

tasks.named('jar') {
    from project(':common').sourceSets.main.output
    from(rootProject.file('LICENSE'))
}
